# Configuração usada nos testes (ativada com @ActiveProfiles("test")).
# Fica em src/test/resources (antes estava em src/test/java/resources, onde o Spring não encontrava).

# Banco H2 em memória ("mem", antes estava escrito "men"). MODE=MySQL imita o comportamento do MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
# Driver do H2.
spring.datasource.driver-class-name=org.h2.Driver
# Usuário padrão do H2.
spring.datasource.username=sa
# Sem senha.
spring.datasource.password=

# Cria as tabelas no início dos testes e apaga no final.
spring.jpa.hibernate.ddl-auto=create-drop

# Chave de JWT só para testes.
api.security.token.secret=chave-usada-somente-nos-testes

# Administrador inicial usado nos testes de integração.
app.admin.email=admin@teste.com
app.admin.senha=admin123

# Nos testes, não grava log em arquivo.
logging.file.name=
