# =====================================================================
# Configuração principal da aplicação.
# A sintaxe ${VARIAVEL:padrao} lê uma variável de ambiente; se ela não existir, usa o valor depois dos ":".
# NÃO coloque senhas reais aqui: este arquivo vai para o GitHub.
# Para sua máquina, use src/main/resources/application-local.properties (ignorado pelo Git).
# =====================================================================

# Nome da aplicação.
spring.application.name=gestao-clinica

# Se nenhum perfil for informado, ativa o perfil "local", que carrega o application-local.properties.
spring.profiles.default=local

# ----- Banco de dados (MySQL) -----
# URL de conexão. createDatabaseIfNotExist cria o banco "clinica" se ele não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?createDatabaseIfNotExist=true}
# Usuário do banco.
spring.datasource.username=${DB_USERNAME:root}
# Senha do banco.
spring.datasource.password=${DB_PASSWORD:}

# ----- JPA / Hibernate -----
# "update": o Hibernate cria/atualiza as tabelas a partir das entidades ao iniciar.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Não imprime cada SQL no console (ative no application-local.properties se quiser estudar as consultas).
spring.jpa.show-sql=false
# Desliga o "open in view": as consultas ao banco acontecem só dentro dos services (boa prática).
spring.jpa.open-in-view=false

# ----- Segurança (JWT) -----
# Chave usada para assinar os tokens. Em produção, defina a variável JWT_SECRET com um valor longo e aleatório.
api.security.token.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao}
# Validade do token em segundos (7200 = 2 horas).
api.security.token.expiracao-segundos=${JWT_EXPIRACAO:7200}

# ----- Administrador inicial (criado se não existir nenhum administrador) -----
# E-mail do primeiro administrador.
app.admin.email=${ADMIN_EMAIL:admin@clinica.com}
# Senha do primeiro administrador (troque em produção!).
app.admin.senha=${ADMIN_SENHA:admin123}

# ----- CORS -----
# Sites que podem chamar a API pelo navegador (separe vários por vírgula). 4200 = Angular.
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}

# ----- Paginação -----
# Formato estável do JSON das páginas: { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }.
spring.data.web.pageable.serialization-mode=via-dto
# Tamanho máximo de página que o cliente pode pedir (evita ?size=1000000).
spring.data.web.pageable.max-page-size=100

# ----- Logs -----
# Nível de log do nosso código (TRACE < DEBUG < INFO < WARN < ERROR).
logging.level.com.clinica.gestao_clinica=INFO
# Acrescenta o id da requisição (gerado pelo RequisicaoLogFilter) em cada linha de log.
logging.pattern.level=%5p [req:%X{requestId:-sistema}]
# Também grava os logs em arquivo.
logging.file.name=${LOG_FILE:logs/gestao-clinica.log}
# Cria um arquivo novo quando o atual passar de 10 MB.
logging.logback.rollingpolicy.max-file-size=10MB
# Mantém os arquivos dos últimos 7 dias.
logging.logback.rollingpolicy.max-history=7
